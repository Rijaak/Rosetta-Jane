[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-jane"
version = "0.1.0"
description = "Rosetta-Jane: community AI. One model across many volunteer devices, peer to peer, no central server."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = ["torch", "transformers", "peft", "safetensors", "cryptography"]

[project.optional-dependencies]
fourbit = ["bitsandbytes"]
test = ["pytest", "tokenizers"]

[project.scripts]
rosetta_jane = "rosetta_jane.cli:main"

[tool.setuptools]
packages = ["rosetta_jane", "rosetta_jane.lan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
